name: Update & Build OrangeFox Recovery

on:
  workflow_dispatch: # Run manually from Actions tab
  push:
    branches: [ "fox_10.0" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Pull latest OrangeFox upstream
        run: |
          git remote add upstream https://gitlab.com/OrangeFox/OrangeFox.git || true
          git fetch upstream fox_10.0
          git merge upstream/fox_10.0 --no-edit || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev imagemagick \
            python3 python-is-python3

      - name: Build recovery
        run: |
          make clean
          make -j$(nproc)

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-recovery-latest
          path: out/target/product/*/recovery.img
